version: "3.9"

services:
  mealie:
    image: hkotel/mealie:v1.2.0

    volumes:
      - ${DOCKER_PATH_PERSISTENT}/mealie/data:/app/data/

    ports:
      - target: 9000
        published: 9925
        protocol: tcp
        mode: ingress

    networks:
      - infra_net

    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:9000', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NODE_HOSTNAME}

      restart_policy:
        condition: any
        delay: 10s
        window: 120s

      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 30s

      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first

      resources:
        reservations:
          cpus: "${MEALIE_RES_CPU}"
          memory: ${MEALIE_RES_MEM}
        limits:
          cpus: "${MEALIE_LIM_CPU}"
          memory: ${MEALIE_LIM_MEM}

      labels:
        - "com.centurylinklabs.watchtower.scope=swarm"

        - "traefik.enable=true"
        - "traefik.swarm.network=${DOCKER_NETWORK:-infra_net}"

        - "traefik.http.routers.${STACK_KEY}-http.rule=Host(`${MEALIE_HOST}`)"
        - "traefik.http.routers.${STACK_KEY}-http.entrypoints=http"
        - "traefik.http.routers.${STACK_KEY}-http.middlewares=redirect-to-https@file"
        - "traefik.http.routers.${STACK_KEY}-http.service=noop@internal"

        - "traefik.http.routers.${STACK_KEY}-https.rule=Host(`${MEALIE_HOST}`)"
        - "traefik.http.routers.${STACK_KEY}-https.entrypoints=https"
        - "traefik.http.routers.${STACK_KEY}-https.tls.certresolver=step"
        - "traefik.http.routers.${STACK_KEY}-https.service=${STACK_KEY}-svc"

        - "traefik.http.services.${STACK_KEY}-svc.loadbalancer.server.port=9000"

networks:
  infra_net:
    external: true
    name: ${DOCKER_NETWORK:-infra_net}
